name: Update contribution breakdown

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-breakdown
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate contribution breakdown
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/update-contribution-breakdown.mjs

      - name: Commit changed chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-breakdown-light.svg assets/contribution-breakdown-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution percentages unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: update contribution breakdown"
          git push
